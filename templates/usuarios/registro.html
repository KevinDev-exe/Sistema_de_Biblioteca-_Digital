{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card wide">
    <h1>Crear cuenta</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="invalid-text">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
      </div>
      <button class="btn btn-primary w-100 mt-4" type="submit">Registrarme</button>
    </form>
    <div class="auth-links"><a href="{% url 'login' %}">Ya tengo cuenta</a></div>
  </div>
</div>
{% endblock %}
