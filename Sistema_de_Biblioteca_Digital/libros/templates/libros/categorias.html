{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow-sm">

    <h1>
        Categorías
    </h1>

    <p class="text-muted">
        Lista de categorías registradas.
    </p>

    <table class="table">

        <thead>

            <tr>

                <th>
                    Nombre
                </th>

            </tr>

        </thead>

        <tbody>

            {% for categoria in categorias %}

            <tr>

                <td>
                    {{ categoria.nombre }}
                </td>

            </tr>

            {% empty %}

            <tr>

                <td>
                    No hay categorías registradas.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
