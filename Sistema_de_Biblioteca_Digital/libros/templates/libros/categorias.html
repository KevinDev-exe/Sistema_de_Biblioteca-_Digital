{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow-sm">

    <div class="d-flex justify-content-between mb-3">

        <div>

            <h1>
                Categorías
            </h1>

            <p class="text-muted">
                Lista de categorías registradas.
            </p>

        </div>

        <a
            href="{% url 'crear_categoria' %}"
            class="btn btn-primary"
        >
            Nueva categoría
        </a>

    </div>

    <table class="table">

        <thead>

            <tr>

                <th>
                    Nombre
                </th>

                <th>
                    Acciones
                </th>

            </tr>

        </thead>

        <tbody>

            {% for categoria in categorias %}

            <tr>

                <td>
                    {{ categoria.nombre }}
                </td>

                <td>

                    <a
                        href="{% url 'editar_categoria' categoria.id %}"
                        class="btn btn-warning btn-sm"
                    >
                        Editar
                    </a>

                    <a
                        href="{% url 'eliminar_categoria' categoria.id %}"
                        class="btn btn-danger btn-sm"
                    >
                        Eliminar
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>

                <td colspan="2">
                    No hay categorías registradas.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
