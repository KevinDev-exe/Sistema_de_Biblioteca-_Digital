{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow-sm">

    <h1>
        Autores
    </h1>

    <p class="text-muted">
        Lista de autores registrados.
    </p>

    <table class="table">

        <thead>

            <tr>

                <th>
                    Nombre
                </th>

            </tr>

        </thead>

        <tbody>

            {% for autor in autores %}

            <tr>

                <td>
                    {{ autor.nombre }}
                </td>

            </tr>

            {% empty %}

            <tr>

                <td>
                    No hay autores registrados.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
