{% extends 'base.html' %}

{% block auth_content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="panel border-0 shadow-sm table-panel mt-4">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Nueva contraseña
                </h1>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Cambiar contraseña
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock auth_content %}
