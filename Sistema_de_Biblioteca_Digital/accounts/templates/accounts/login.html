{% extends 'base.html' %}

{% block auth_content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-4">

        <div class="card shadow border-0">

            <div class="card-body p-4">

                <h2 class="text-center fw-bold mb-2">
                    Biblioteca Digital
                </h2>

                <p class="text-center text-muted mb-4">
                    Gestión académica de libros, préstamos y reservas.
                </p>

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-danger">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Ingresar
                    </button>

                </form>

                <div class="d-flex justify-content-between mt-3">

                    <a href="{% url 'registro' %}">
                        Crear cuenta
                    </a>

                    <a href="{% url 'password_reset' %}">
                        Recuperar contraseña
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock auth_content %}
