{% extends 'base.html' %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%; overflow: hidden;">
        <!-- Cabecera -->
        <div class="bg-primary bg-gradient p-4 text-center text-white position-relative">
            <div class="bg-white text-primary rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-book-half fs-2"></i>
            </div>
            <h2 class="fw-bolder mb-1 fs-3">BiblioPro</h2>
            <p class="text-white-50 mb-0 small">Acceso al sistema bibliotecario</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger d-flex align-items-center p-3 mb-4 rounded-3 border-0 shadow-sm" role="alert" style="background-color: #fef2f2; color: #991b1b;">
                    <i class="bi bi-exclamation-octagon-fill fs-5 me-2"></i>
                    <div class="small fw-medium">{{ message }}</div>
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary small text-uppercase" style="letter-spacing: 0.5px;">Usuario</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-light border-0 text-muted px-3"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-light border-0 px-3 fs-6" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-bold text-secondary small text-uppercase mb-0" style="letter-spacing: 0.5px;">Contraseña</label>
                        <a href="{% url 'password_reset' %}" class="text-primary text-decoration-none small fw-semibold transition-hover">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-light border-0 text-muted px-3"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-0 px-3 fs-6" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-4">
                    Ingresar <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="text-center">
                <span class="text-muted small">¿No tienes una cuenta?</span>
                <a href="{% url 'registro' %}" class="text-primary text-decoration-none fw-bold small ms-1 transition-hover">Regístrate aquí</a>
            </div>
        </div>
    </div>
</div>
{% endblock auth_content %}
