{% extends 'base.html' %}

{% block content %}

<div class="panel border-0 shadow-sm table-panel mt-4">

    <div class="card-body p-4">

        <h1>
            Mi perfil
        </h1>

        <p class="text-muted">
            Datos personales de la cuenta.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Primer nombre
                </label>

                {{ form.primer_nombre }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Segundo nombre
                </label>

                {{ form.segundo_nombre }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Primer apellido
                </label>

                {{ form.primer_apellido }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Segundo apellido
                </label>

                {{ form.segundo_apellido }}

            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Guardar cambios
            </button>

        </form>

    </div>

</div>

{% endblock %}
