{% extends 'base.html' %}

{% block auth_content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="panel border-0 shadow-sm p-5 bg-white rounded-4 text-center">
            
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-4 shadow-sm" style="width: 80px; height: 80px;">
                <i class="bi bi-check-circle-fill" style="font-size: 2.5rem;"></i>
            </div>
            
            <h2 class="fw-extrabold text-dark mb-3">¡Contraseña actualizada!</h2>
            
            <p class="text-secondary mb-4" style="font-size: 1.1rem;">
                Tu contraseña ha sido restablecida correctamente. Ya puedes acceder a todas las funciones de tu cuenta.
            </p>
            
            <a href="{% url 'login' %}" class="btn btn-primary w-100 fw-bold rounded-pill shadow-sm py-3 transition-hover">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ir al inicio de sesión
            </a>
            
        </div>
    </div>
</div>

{% endblock %}
